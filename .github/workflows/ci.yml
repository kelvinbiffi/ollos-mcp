name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          # tests generate their own media with ffmpeg lavfi; the VAD test falls back to the energy gate if the 2 MB Silero download is blocked
          OLLOS_HOME: ${{ runner.temp }}/ollos
      - run: npm run build
      - name: Smoke the built MCP binary (initialize + tools/list must be pure JSON-RPC)
        shell: bash
        run: |
          node -e "
          const { spawn } = require('child_process');
          const p = spawn(process.execPath, ['dist/mcp/bin.js']);
          let out = '';
          p.stdout.on('data', d => out += d);
          p.stdin.write(JSON.stringify({jsonrpc:'2.0',id:1,method:'initialize',params:{protocolVersion:'2025-06-18',capabilities:{},clientInfo:{name:'ci',version:'0'}}}) + '\n');
          setTimeout(() => { p.stdin.write(JSON.stringify({jsonrpc:'2.0',method:'notifications/initialized'}) + '\n'); p.stdin.write(JSON.stringify({jsonrpc:'2.0',id:2,method:'tools/list',params:{}}) + '\n'); }, 500);
          setTimeout(() => {
            p.kill();
            const lines = out.trim().split('\n').map(l => JSON.parse(l));
            const tools = lines.find(l => l.id === 2)?.result?.tools?.length;
            if (tools !== 10) { console.error('expected 10 tools, got', tools); process.exit(1); }
            if (!lines.every(l => l.jsonrpc === '2.0')) { console.error('non JSON-RPC output on stdout'); process.exit(1); }
            console.log('ok:', tools, 'tools, stdout clean');
          }, 3000);
          "
