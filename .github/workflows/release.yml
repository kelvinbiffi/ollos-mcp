name: Release

# Publishes to npm with provenance and to the MCP Registry when a GitHub release is published.
# npm: trusted publishing (OIDC) once a Trusted Publisher is configured on npmjs.com for kelvinbiffi/ollos-mcp + release.yml;
# the NPM_TOKEN secret is only a fallback (npm is phasing out tokens that bypass 2FA).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing (OIDC, no token) needs npm >= 11.5; the Node 22 image ships an older npm
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - name: Check version matches the tag
        if: github.event_name == 'release'
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          test "$PKG" = "$TAG" || { echo "package.json is $PKG but tag is $TAG"; exit 1; }
      # With a Trusted Publisher configured on npmjs.com for this repo + workflow, no secret is needed:
      # npm exchanges the GitHub OIDC token itself. NPM_TOKEN is only a fallback.
      # 0.1.0 was published from a workstation (browser 2FA); a re-run must not fail on "version already exists"
      - name: Publish to npm unless this version is already there
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "ollos-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "ollos-mcp@$VERSION is already on npm; skipping publish"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  mcp-registry:
    needs: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz" | tar xz
      - name: Login (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish
